services:
  postgres:
    image: postgres:17-alpine
    ports:
      # Host port 5433 — 5432 is often already taken by a local Postgres.
      - "5433:5432"
    environment:
      POSTGRES_USER: apo
      POSTGRES_PASSWORD: apo
      POSTGRES_DB: apo
    volumes:
      - apo_postgres_data:/var/lib/postgresql/data
      # Creates a second `apo_test` database alongside the default `apo` one,
      # so unit-DB and integration-test data never mix.
      - ./scripts/db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apo -d apo"]
      interval: 2s
      timeout: 3s
      retries: 10

  pay-core:
    build:
      context: .
      dockerfile: packages/pay-core/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://apo:apo@postgres:5432/apo
      PORT: "3000"
    ports:
      - "3000:3000"
    init: true
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  apo_postgres_data:
